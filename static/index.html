<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klyor</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      color-scheme: light;
      --bg: #ffffff;
      --text: #171717;
      --muted: #737373;
      --border: #e5e5e5;
      --surface: #f7f7f7;
      --code: #f5f5f5;
      --accent: #2563eb;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body {
      overflow: hidden;
    }

    button,
    textarea {
      font: inherit;
    }

    #app {
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 58px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      padding: 0 24px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .chat {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
    }

    .messages {
      width: min(820px, calc(100% - 32px));
      margin: 0 auto;
      padding: 42px 0 150px;
    }

    .welcome {
      min-height: calc(100dvh - 58px);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px;
    }

    .welcome-inner {
      width: min(620px, 100%);
    }

    .welcome h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 46px);
      letter-spacing: -0.045em;
    }

    .welcome p {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 15px;
    }

    .message {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 30px;
    }

    .message.user {
      align-items: flex-end;
    }

    .message.assistant {
      align-items: flex-start;
    }

    .message-role {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .message-body {
      max-width: 100%;
      font-size: 15px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .user .message-body {
      max-width: min(680px, 90%);
      padding: 11px 15px;
      border-radius: 16px;
      background: #f1f1f1;
    }

    .message-body p {
      margin: 0 0 14px;
    }

    .message-body p:last-child {
      margin-bottom: 0;
    }

    .message-body h1,
    .message-body h2,
    .message-body h3 {
      letter-spacing: -0.025em;
      line-height: 1.25;
      margin: 24px 0 10px;
    }

    .message-body h1:first-child,
    .message-body h2:first-child,
    .message-body h3:first-child {
      margin-top: 0;
    }

    .message-body ul,
    .message-body ol {
      padding-left: 24px;
    }

    .message-body a {
      color: var(--accent);
    }

    .code-wrap {
      position: relative;
      margin: 16px 0;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      background: var(--code);
    }

    .code-header {
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px 0 13px;
      border-bottom: 1px solid var(--border);
      color: var(--muted);
      font-size: 11px;
    }

    .copy-code {
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      padding: 5px 8px;
      border-radius: 6px;
    }

    .copy-code:hover {
      background: #e9e9e9;
      color: var(--text);
    }

    pre {
      margin: 0;
      padding: 16px;
      overflow-x: auto;
      font-family:
        "SFMono-Regular",
        Consolas,
        "Liberation Mono",
        monospace;
      font-size: 13px;
      line-height: 1.65;
    }

    code {
      font-family:
        "SFMono-Regular",
        Consolas,
        "Liberation Mono",
        monospace;
      font-size: 0.92em;
    }

    :not(pre) > code {
      padding: 2px 5px;
      border-radius: 5px;
      background: var(--code);
    }

    .composer-area {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 16px 20px 22px;
      pointer-events: none;
      background: linear-gradient(
        to bottom,
        transparent,
        rgba(255,255,255,0.92) 22%,
        var(--bg) 55%
      );
    }

    .composer {
      pointer-events: auto;
      width: min(820px, 100%);
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 9px;
      border: 1px solid #d9d9d9;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 8px 30px rgba(0,0,0,0.07);
    }

    textarea {
      flex: 1;
      min-width: 0;
      max-height: 180px;
      min-height: 42px;
      resize: none;
      border: 0;
      outline: 0;
      padding: 10px 8px;
      background: transparent;
      color: var(--text);
      line-height: 1.45;
    }

    textarea::placeholder {
      color: #9a9a9a;
    }

    #send {
      width: 38px;
      height: 38px;
      flex-shrink: 0;
      border: 0;
      border-radius: 10px;
      background: #171717;
      color: white;
      cursor: pointer;
      font-size: 17px;
    }

    #send:hover {
      background: #000;
    }

    #send:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .thinking {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #888;
      animation: pulse 1.1s infinite ease-in-out;
    }

    .dot:nth-child(2) {
      animation-delay: .15s;
    }

    .dot:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes pulse {
      0%, 60%, 100% {
        opacity: .3;
      }
      30% {
        opacity: 1;
      }
    }

    .error {
      padding: 12px 14px;
      border: 1px solid #f0b8b8;
      border-radius: 9px;
      background: #fff5f5;
      color: #a11;
    }

    @media (max-width: 600px) {
      .topbar {
        padding: 0 16px;
      }

      .messages {
        width: calc(100% - 24px);
        padding-top: 26px;
      }

      .composer-area {
        padding: 10px 10px 14px;
      }

      .composer {
        border-radius: 14px;
      }
    }
  </style>
</head>

<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">Klyor</div>
    </header>

    <main class="chat" id="chat">
      <div class="messages" id="messages">
        <section class="welcome" id="welcome">
          <div class="welcome-inner">
            <h1>How can I help?</h1>
            <p>Ask Klyor anything.</p>
          </div>
        </section>
      </div>
    </main>

    <div class="composer-area">
      <form class="composer" id="composer">
        <textarea
          id="input"
          rows="1"
          autocomplete="off"
          placeholder="Message Klyor..."
        ></textarea>
        <button id="send" type="submit" aria-label="Send">↑</button>
      </form>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById("messages");
    const chatEl = document.getElementById("chat");
    const form = document.getElementById("composer");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const welcome = document.getElementById("welcome");

    const conversation = [];

    function escapeHtml(value) {
      return value
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function inlineMarkdown(value) {
      let text = escapeHtml(value);

      text = text.replace(
        /`([^`]+)`/g,
        "<code>$1</code>"
      );

      text = text.replace(
        /\*\*([^*]+)\*\*/g,
        "<strong>$1</strong>"
      );

      text = text.replace(
        /\*([^*]+)\*/g,
        "<em>$1</em>"
      );

      text = text.replace(
        /\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
        '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>'
      );

      return text;
    }

    function markdown(text) {
      const blocks = [];
      const protectedText = text.replace(
        /```([a-zA-Z0-9_+-]*)\n?([\s\S]*?)```/g,
        (_, language, code) => {
          const index = blocks.length;
          blocks.push({
            language: language || "code",
            code: code.replace(/^\n|\n$/g, "")
          });
          return `@@CODE_${index}@@`;
        }
      );

      const lines = protectedText.split("\n");
      const output = [];
      let list = null;

      function closeList() {
        if (list === "ul") output.push("</ul>");
        if (list === "ol") output.push("</ol>");
        list = null;
      }

      for (const line of lines) {
        if (!line.trim()) {
          closeList();
          continue;
        }

        const heading = line.match(/^(#{1,3})\s+(.+)$/);
        if (heading) {
          closeList();
          const level = heading[1].length;
          output.push(
            `<h${level}>${inlineMarkdown(heading[2])}</h${level}>`
          );
          continue;
        }

        const bullet = line.match(/^\s*[-*]\s+(.+)$/);
        if (bullet) {
          if (list !== "ul") {
            closeList();
            output.push("<ul>");
            list = "ul";
          }
          output.push(`<li>${inlineMarkdown(bullet[1])}</li>`);
          continue;
        }

        const numbered = line.match(/^\s*\d+\.\s+(.+)$/);
        if (numbered) {
          if (list !== "ol") {
            closeList();
            output.push("<ol>");
            list = "ol";
          }
          output.push(`<li>${inlineMarkdown(numbered[1])}</li>`);
          continue;
        }

        closeList();

        if (line.startsWith("@@CODE_")) {
          output.push(line);
        } else {
          output.push(`<p>${inlineMarkdown(line)}</p>`);
        }
      }

      closeList();

      let html = output.join("");

      html = html.replace(
        /@@CODE_(\d+)@@/g,
        (_, index) => {
          const block = blocks[Number(index)];
          const safeCode = escapeHtml(block.code);

          return `
            <div class="code-wrap">
              <div class="code-header">
                <span>${escapeHtml(block.language)}</span>
                <button class="copy-code" type="button" data-code="${encodeURIComponent(block.code)}">Copy</button>
              </div>
              <pre><code>${safeCode}</code></pre>
            </div>
          `;
        }
      );

      return html;
    }

    function addMessage(role, content) {
      if (welcome) {
        welcome.remove();
      }

      const wrapper = document.createElement("article");
      wrapper.className = `message ${role}`;

      const label = document.createElement("div");
      label.className = "message-role";
      label.textContent = role === "user" ? "You" : "Klyor";

      const body = document.createElement("div");
      body.className = "message-body";

      if (role === "assistant") {
        body.innerHTML = markdown(content);
      } else {
        body.textContent = content;
      }

      wrapper.append(label, body);
      messagesEl.appendChild(wrapper);

      requestAnimationFrame(() => {
        chatEl.scrollTop = chatEl.scrollHeight;
      });

      return wrapper;
    }

    function addThinking() {
      const wrapper = document.createElement("article");
      wrapper.className = "message assistant";

      wrapper.innerHTML = `
        <div class="message-role">Klyor</div>
        <div class="thinking">
          <span>Thinking</span>
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      `;

      messagesEl.appendChild(wrapper);
      chatEl.scrollTop = chatEl.scrollHeight;

      return wrapper;
    }

    function addError(message) {
      const wrapper = document.createElement("article");
      wrapper.className = "message assistant";

      wrapper.innerHTML = `
        <div class="message-role">Klyor</div>
        <div class="message-body">
          <div class="error">${escapeHtml(message)}</div>
        </div>
      `;

      messagesEl.appendChild(wrapper);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function resizeInput() {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 180) + "px";
    }

    async function sendMessage() {
      const content = input.value.trim();

      if (!content || send.disabled) {
        return;
      }

      conversation.push({
        role: "user",
        content
      });

      addMessage("user", content);

      input.value = "";
      resizeInput();
      send.disabled = true;

      const thinking = addThinking();

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            messages: conversation,
            mode: "general"
          })
        });

        let data;

        try {
          data = await response.json();
        } catch {
          throw new Error(
            `Server returned ${response.status} without valid JSON.`
          );
        }

        if (!response.ok) {
          throw new Error(
            data.detail ||
            data.message ||
            `Request failed with status ${response.status}.`
          );
        }

        thinking.remove();

        const answer =
          typeof data.message === "string"
            ? data.message
            : "Klyor returned an invalid response.";

        conversation.push({
          role: "assistant",
          content: answer
        });

        addMessage("assistant", answer);
      } catch (error) {
        thinking.remove();
        addError(error.message || "Something went wrong.");
      } finally {
        send.disabled = false;
        input.focus();
      }
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      sendMessage();
    });

    input.addEventListener("input", resizeInput);

    input.addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    document.addEventListener("click", async event => {
      const button = event.target.closest(".copy-code");

      if (!button) {
        return;
      }

      const code = decodeURIComponent(button.dataset.code || "");

      try {
        await navigator.clipboard.writeText(code);
        button.textContent = "Copied";

        setTimeout(() => {
          button.textContent = "Copy";
        }, 1200);
      } catch {
        button.textContent = "Failed";

        setTimeout(() => {
          button.textContent = "Copy";
        }, 1200);
      }
    });

    input.focus();
  </script>
</body>
</html>
