<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klyor Brain</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #0b0b0d;
      color: #f5f5f5;
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    button,
    textarea {
      font: inherit;
    }

    body {
      overflow: hidden;
    }

    .app {
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 64px;
      flex: 0 0 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      border-bottom: 1px solid #242429;
      background: #101014;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: #f5f5f5;
      color: #111;
      font-size: 14px;
      font-weight: 900;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #9b9ba3;
      font-size: 13px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #57d68a;
    }

    .chat {
      width: min(920px, 100%);
      margin: 0 auto;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 40px 28px 28px;
    }

    .welcome {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
    }

    .welcome h1 {
      margin: 0 0 12px;
      font-size: clamp(32px, 5vw, 54px);
      letter-spacing: -0.045em;
    }

    .welcome p {
      max-width: 620px;
      margin: 0;
      color: #9b9ba3;
      font-size: 16px;
      line-height: 1.6;
    }

    .examples {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 28px;
    }

    .example {
      border: 1px solid #292930;
      background: #141419;
      color: #cfcfd5;
      border-radius: 14px;
      padding: 11px 15px;
      cursor: pointer;
      transition: .15s ease;
    }

    .example:hover {
      border-color: #4b4b55;
      background: #19191f;
    }

    .message {
      display: flex;
      gap: 14px;
      margin: 0 auto 28px;
      max-width: 850px;
    }

    .avatar {
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 800;
      background: #1d1d23;
      border: 1px solid #303038;
    }

    .message.user .avatar {
      background: #f5f5f5;
      color: #111;
      border-color: #f5f5f5;
    }

    .content {
      min-width: 0;
      flex: 1;
      line-height: 1.65;
      color: #dedee3;
      overflow-wrap: anywhere;
    }

    .content p {
      margin: 0 0 12px;
    }

    .content p:last-child {
      margin-bottom: 0;
    }

    .content pre {
      position: relative;
      overflow-x: auto;
      margin: 14px 0;
      padding: 18px;
      border-radius: 14px;
      background: #08080a;
      border: 1px solid #28282e;
      font-size: 13px;
      line-height: 1.55;
    }

    .content code {
      font-family:
        "SFMono-Regular",
        Consolas,
        "Liberation Mono",
        monospace;
    }

    .inline-code {
      padding: 2px 6px;
      border-radius: 6px;
      background: #1b1b21;
      color: #f0f0f3;
    }

    .composer-wrap {
      padding: 16px 28px 24px;
    }

    .composer {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 10px;
      border: 1px solid #303038;
      border-radius: 20px;
      background: #151519;
      box-shadow: 0 15px 50px rgba(0,0,0,.25);
    }

    textarea {
      flex: 1;
      min-height: 48px;
      max-height: 220px;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: #f5f5f5;
      padding: 13px 12px;
      line-height: 1.45;
    }

    textarea::placeholder {
      color: #707079;
    }

    .send {
      width: 46px;
      height: 46px;
      border: 0;
      border-radius: 14px;
      background: #f5f5f5;
      color: #101014;
      cursor: pointer;
      font-weight: 800;
    }

    .send:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .hint {
      text-align: center;
      margin-top: 9px;
      color: #66666f;
      font-size: 11px;
    }

    .typing {
      color: #898992;
      font-size: 14px;
    }

    @media (max-width: 650px) {
      .topbar {
        padding: 0 16px;
      }

      .messages {
        padding: 24px 16px;
      }

      .composer-wrap {
        padding: 12px 16px 16px;
      }

      .welcome {
        padding: 10px;
      }

      .message {
        gap: 10px;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">K</div>
        <span>Klyor Brain</span>
      </div>

      <div class="status">
        <span class="status-dot"></span>
        <span id="modelStatus">Local brain</span>
      </div>
    </header>

    <main class="chat">
      <section id="messages" class="messages">
        <div id="welcome" class="welcome">
          <h1>Teach Klyor Brain.</h1>
          <p>
            Start a conversation. This is the first layer of Klyor's intelligence.
            Later, we'll teach it how to understand projects and build websites.
          </p>

          <div class="examples">
            <button class="example">Explain HTML to me</button>
            <button class="example">Write a simple JavaScript function</button>
            <button class="example">How should an AI build websites?</button>
          </div>
        </div>
      </section>

      <div class="composer-wrap">
        <form id="composer" class="composer">
          <textarea
            id="input"
            rows="1"
            placeholder="Message Klyor Brain..."
            autocomplete="off"
          ></textarea>

          <button id="send" class="send" type="submit">↑</button>
        </form>

        <div class="hint">
          Enter to send · Shift + Enter for a new line
        </div>
      </div>
    </main>
  </div>

  <script>
    const messagesEl = document.getElementById("messages");
    const welcomeEl = document.getElementById("welcome");
    const composer = document.getElementById("composer");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const modelStatus = document.getElementById("modelStatus");

    const history = [];

    function escapeHtml(value) {
      return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function renderMarkdown(text) {
      let html = escapeHtml(text);

      const blocks = [];

      html = html.replace(
        /```([a-zA-Z0-9_+-]*)\\n?([\\s\\S]*?)```/g,
        (_, language, code) => {
          const id = `code-${blocks.length}`;
          blocks.push({
            id,
            code: code.trim()
          });

          return `
            <pre>
              <code>${escapeHtml(code.trim())}</code>
            </pre>
          `;
        }
      );

      html = html.replace(/`([^`]+)`/g, '<code class="inline-code">$1</code>');
      html = html.replace(/^### (.+)$/gm, "<h3>$1</h3>");
      html = html.replace(/^## (.+)$/gm, "<h2>$1</h2>");
      html = html.replace(/^# (.+)$/gm, "<h1>$1</h1>");
      html = html.replace(/\\*\\*(.+?)\\*\\*/g, "<strong>$1</strong>");
      html = html.replace(/\\*([^*]+)\\*/g, "<em>$1</em>");
      html = html.replace(/\\n\\n/g, "</p><p>");
      html = html.replace(/\\n/g, "<br>");

      html = `<p>${html}</p>`;

      return html;
    }

    function addMessage(role, text) {
      welcomeEl.style.display = "none";

      const wrapper = document.createElement("article");
      wrapper.className = `message ${role}`;

      wrapper.innerHTML = `
        <div class="avatar">${role === "user" ? "YOU" : "K"}</div>
        <div class="content">${renderMarkdown(text)}</div>
      `;

      messagesEl.appendChild(wrapper);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addTyping() {
      const wrapper = document.createElement("article");
      wrapper.className = "message";
      wrapper.id = "typing";

      wrapper.innerHTML = `
        <div class="avatar">K</div>
        <div class="content typing">Thinking…</div>
      `;

      messagesEl.appendChild(wrapper);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function removeTyping() {
      document.getElementById("typing")?.remove();
    }

    function setBusy(value) {
      send.disabled = value;
      input.disabled = value;
    }

    async function sendMessage(text) {
      text = text.trim();

      if (!text || send.disabled) {
        return;
      }

      addMessage("user", text);
      history.push({
        role: "user",
        content: text
      });

      input.value = "";
      input.style.height = "auto";

      setBusy(true);
      addTyping();

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            messages: history
          })
        });

        const data = await response.json();

        removeTyping();

        if (!response.ok) {
          throw new Error(data.detail || "Request failed.");
        }

        addMessage("assistant", data.message);

        history.push({
          role: "assistant",
          content: data.message
        });
      } catch (error) {
        removeTyping();

        const message =
          error instanceof Error
            ? error.message
            : "Something went wrong.";

        addMessage(
          "assistant",
          `⚠️ ${message}`
        );
      } finally {
        setBusy(false);
        input.focus();
      }
    }

    composer.addEventListener("submit", event => {
      event.preventDefault();
      sendMessage(input.value);
    });

    input.addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        composer.requestSubmit();
      }
    });

    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height =
        Math.min(input.scrollHeight, 220) + "px";
    });

    document.querySelectorAll(".example").forEach(button => {
      button.addEventListener("click", () => {
        input.value = button.textContent;
        input.dispatchEvent(new Event("input"));
        input.focus();
      });
    });

    async function loadModelStatus() {
      try {
        const response = await fetch("/api/model");
        const data = await response.json();

        modelStatus.textContent = data.model;
      } catch {
        modelStatus.textContent = "Local brain";
      }
    }

    loadModelStatus();
  </script>
</body>
</html>
